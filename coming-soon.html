<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Campusly</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Reveal-on-scroll: flag JS before first paint to avoid a flash -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="auth-body">

  <div class="auth-container animate-fade-up" style="max-width: 600px; padding: var(--spacing-8) var(--spacing-5);">
    <a href="index.html" class="logo auth-logo" style="margin-bottom: var(--spacing-4);"><img src="assets/images/campusly-logo.svg" alt="Campusly" class="logo-img"></a>
    
    <h1 style="margin-bottom: var(--spacing-2);">Something big is coming.</h1>
    <p class="lead" style="margin-bottom: var(--spacing-6);">We're building a new tool to revolutionize your college admissions process. Be the first to know when we launch.</p>
    
    <!-- Countdown Timer (CSS only visualization for template) -->
    <div style="display: flex; justify-content: center; gap: var(--spacing-4); margin-bottom: var(--spacing-6);">
      <div style="text-align: center;">
        <h2 style="color: var(--accent); margin: 0; font-size: 2.5rem;">14</h2>
        <span class="caption" style="text-transform: uppercase; letter-spacing: 1px;">Days</span>
      </div>
      <div style="text-align: center;">
        <h2 style="color: var(--accent); margin: 0; font-size: 2.5rem;">08</h2>
        <span class="caption" style="text-transform: uppercase; letter-spacing: 1px;">Hours</span>
      </div>
      <div style="text-align: center;">
        <h2 style="color: var(--accent); margin: 0; font-size: 2.5rem;">45</h2>
        <span class="caption" style="text-transform: uppercase; letter-spacing: 1px;">Mins</span>
      </div>
    </div>
    
    <!-- Newsletter Signup Placeholder (Mailchimp embed comment) -->
    <!-- MAILCHIMP_EMBED_START -->
    <form class="validate-form" style="display: flex; gap: var(--spacing-2); max-width: 400px; margin: 0 auto;" novalidate>
      <div class="form-group" style="flex: 1; margin: 0;">
        <input type="email" class="form-control" placeholder="Enter your email address" required>
      </div>
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>
    <!-- MAILCHIMP_EMBED_END -->
    
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
