<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campusly</title>
  <meta name="description" content="Login to your Campusly student account to access college application counseling, essays, and admissions tools.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Icon Font -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Reveal-on-scroll: flag JS before first paint to avoid a flash -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="auth-body">

  <!-- Top Utilities Bar -->
  <div class="auth-topbar">
    <div class="auth-top-actions">
      <button class="theme-toggle" aria-label="Toggle Dark Mode" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border);">
        <i class="ph ph-moon"></i>
      </button>
      <button class="rtl-toggle" aria-label="Toggle RTL" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border);">
        <i class="ph ph-arrows-left-right"></i>
      </button>
    </div>
  </div>

  <!-- Centered Auth Card Container -->
  <main class="auth-card animate-fade-up">
    <!-- Brand Logo -->
    <a href="index.html" class="auth-brand" aria-label="Campusly Home"><img src="assets/images/campusly-logo.svg" alt="Campusly" class="logo-img"></a>
    
    <!-- Title & Subtitle -->
    <h1 class="auth-title">WELCOME BACK</h1>
    <p class="auth-subtitle">Login to manage your college applications, essays and counseling sessions</p>
    
    <!-- Login Form -->
    <form class="auth-form validate-form" action="dashboard.html" method="GET" novalidate>
      <!-- Email Field -->
      <div class="form-group">
        <label class="auth-label" for="email">EMAIL ADDRESS</label>
        <input type="email" id="email" name="email" class="auth-input form-control" required placeholder="student@example.com" autocomplete="email">
      </div>
      
      <!-- Password Field with Visibility Toggle -->
      <div class="form-group">
        <label class="auth-label" for="password">PASSWORD</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" class="auth-input form-control" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>
      
      <!-- Remember Me & Forgot Password Row -->
      <div class="auth-controls-row">
        <label class="auth-checkbox-label">
          <input type="checkbox" name="remember" class="auth-checkbox">
          <span>Remember me</span>
        </label>
        <a href="#" class="auth-link">Forgot Password?</a>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit">LOGIN TO ACCOUNT</button>
    </form>
    
    <!-- Hairline OR Divider -->
    <div class="auth-divider">
      <span>OR</span>
    </div>
    
    <!-- Social Login Buttons -->
    <div class="auth-social-group">
      <button type="button" class="btn-auth-social">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <button type="button" class="btn-auth-social">
        <i class="ph-fill ph-apple-logo"></i>
        <span>Continue with Apple</span>
      </button>
    </div>
    
    <!-- Footer Registration Link -->
    <div class="auth-card-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
