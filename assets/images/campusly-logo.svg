<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .gold { fill: #C1791A; }
      .gold-stroke { stroke: #C1791A; }
      .wordmark {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        fill: #C1791A;
      }
    </style>
  </defs>

  <!-- Circle badge -->
  <circle cx="34" cy="35" r="26" fill="none" class="gold-stroke" stroke-width="2"/>

  <!-- Graduation cap icon -->
  <g transform="translate(34,33)">
    <!-- cap top (diamond) -->
    <polygon points="-15,0 0,-8 15,0 0,8" class="gold"/>
    <!-- cap base (head) -->
    <path d="M -8,2 L 8,2 L 6,11 Q 0,15 -6,11 Z" class="gold"/>
    <!-- tassel -->
    <line x1="12" y1="-2" x2="17" y2="10" class="gold-stroke" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="17.5" cy="12" r="1.8" class="gold"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="46" class="wordmark">Campusly<tspan font-size="30">.</tspan></text>
</svg>
