<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Campusly</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Reveal-on-scroll: flag JS before first paint to avoid a flash -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="auth-body" style="text-align: center; flex-direction: column;">

  <div class="animate-fade-up">
    <h1 style="font-size: clamp(6rem, 15vw, 12rem); color: var(--accent); margin: 0; line-height: 1;">404</h1>
    <h2 style="margin-bottom: var(--spacing-3);">Lost on Campus?</h2>
    <p class="lead" style="max-width: 500px; margin: 0 auto var(--spacing-5);">It looks like the page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
    
    <div style="display: flex; gap: var(--spacing-3); justify-content: center;">
      <a href="index.html" class="btn btn-primary">Return Home</a>
      <a href="contact.html" class="btn btn-secondary">Contact Support</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>

</html>
